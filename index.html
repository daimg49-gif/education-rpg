<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>最後的校園祭</title><style>
*{box-sizing:border-box}body{margin:0;background:#151f2b;color:#f5ebd7;font-family:system-ui,-apple-system,sans-serif}header{padding:13px 16px;background:#263a4b;border-bottom:3px solid #b78d58;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:21px;margin:0}small{color:#c1d1d6}main{max-width:790px;margin:auto;padding:12px}canvas{width:100%;height:auto;display:block;image-rendering:auto;border:5px ridge #b99468;border-radius:12px;background:#34495b}button{font:600 15px system-ui;background:#395c75;border:2px solid #8caab5;color:white;border-radius:10px;padding:11px 13px;touch-action:manipulation}button:active{filter:brightness(1.3)}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.pad{display:grid;grid-template-columns:repeat(3,52px);gap:4px}.pad button{height:48px;padding:0}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}#interact{background:#a27440;border-color:#d9b27a}section{background:#253749;border:1px solid #668397;border-radius:13px;padding:14px;margin:12px 0;line-height:1.75}section strong{color:#f3d59b}#message{white-space:pre-line;min-height:110px}#choices{display:grid;gap:9px;margin-top:12px}#choices button{text-align:left;line-height:1.5}#choices button:disabled{opacity:.5}.tip{font-size:13px;color:#cad8dd}.paper{background:#f1e4c7;color:#302a24;border:3px double #937c5e;padding:13px;border-radius:5px;white-space:pre-line;margin:10px 0}.paper strong{color:#513b27}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{background:#1a2b3b;border:1px solid #567184;border-radius:8px;padding:10px;font-size:14px}.muted{color:#bdd0d8;font-size:13px}#error{color:#ffb4a7;white-space:pre-wrap}@media(max-width:420px){header{padding:10px}h1{font-size:18px}main{padding:9px}section{padding:12px}.pad{grid-template-columns:repeat(3,48px)}.pad button{height:47px}}
 .game-frame{position:relative;isolation:isolate}.scene-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none;display:none}.game-frame.in-dialog .scene-art{display:block}.game-frame.in-dialog .dialog-overlay{background:linear-gradient(transparent 0%,#08132188 65%)}.dialog-overlay{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none;padding:10px 12px 13px;background:linear-gradient(transparent 20%,#07121b55 65%)}.dialog-overlay[hidden]{display:none}.dialog-box{pointer-events:auto;background:rgba(13,23,43,.96);border:3px solid #d8c8a7;box-shadow:0 0 0 3px #101a29,0 10px 30px #000a;color:#fff5e6;padding:13px 15px 11px;max-height:78%;overflow-y:auto;overscroll-behavior:contain}.dialog-top{display:flex;justify-content:space-between;align-items:center;color:#e9ca88;font-size:12px;letter-spacing:.12em;margin-bottom:6px}.dialog-top button{padding:2px 9px;font-size:17px;line-height:1.2;background:#273a50}.dialog-text{font-size:clamp(13px,2.6vw,18px);line-height:1.65;white-space:pre-line}.dialog-actions{display:grid;gap:6px;margin-top:9px}.dialog-actions button{font-size:clamp(12px,2vw,14px);padding:7px 10px;text-align:left;background:#243c58;border:1px solid #91a8ba;box-shadow:none}.dialog-actions .paper{font-size:13px;line-height:1.6;max-height:160px;overflow:auto;margin:2px 0}.dialog-box::-webkit-scrollbar{width:6px}.dialog-box::-webkit-scrollbar-thumb{background:#a99a80}@media(max-width:420px){.dialog-overlay{padding:6px 7px 9px}.dialog-box{padding:8px 10px;max-height:85%}.dialog-text{font-size:13px;line-height:1.5}.dialog-actions{gap:5px;margin-top:6px}.dialog-actions button{padding:6px 8px;font-size:12px}} </style></head><body><header><div><h1>最後的校園祭 <small>第一章・試行版</small></h1><small>七天前｜青禾國小學生自治會</small></div><button id="reset">重新開始</button></header><main><div class="game-frame" id="gameFrame"><canvas id="game" width="640" height="360" aria-label="校園地圖"></canvas><img class="scene-art" id="sceneArt" src="assets/council-room.svg" alt="故事場景插畫"><div class="dialog-overlay" id="dialogOverlay" hidden><div class="dialog-box" role="dialog" aria-label="遊戲對話"><div class="dialog-top"><span id="dialogSpeaker">青禾國小 · 故事</span><button id="closeDialog" aria-label="關閉對話">×</button></div><div id="dialogText" class="dialog-text"></div><div id="dialogActions" class="dialog-actions"></div></div></div></div><div class="controls"><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><button id="interact">調查／對話</button></div><div class="tip">點選目前教室可查看人物與文件；點選相鄰教室可移動。也可以使用方向鍵切換空間。</div><div id="legacyDialogue" hidden><div id="message"></div><div id="choices"></div></div><section><strong>自治會工作桌</strong><div id="dashboard"></div></section><section><strong>找到的文件與紀錄</strong><div id="records"></div></section><div id="error"></div></main><script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),cv=$('game'),g=cv.getContext('2d'),msg=$('message'),choices=$('choices');
const W=16,H=9,T=40;const overlay=$('dialogOverlay'),dialogText=$('dialogText'),dialogActions=$('dialogActions');let dialogOpen=false;function syncDialog(){if(!dialogText||!dialogActions||!overlay)return;dialogText.textContent=msg.textContent;const first=msg.textContent.split('\n')[0];if($('dialogSpeaker'))$('dialogSpeaker').textContent=first.startsWith('【')?first.replace(/[【】]/g,'').slice(0,22):rooms[state.room].name;dialogActions.replaceChildren();for(const child of choices.children)dialogActions.appendChild(child.cloneNode(true));const original=[...choices.children];const copies=[...dialogActions.children];copies.forEach((copy,i)=>{if(original[i].tagName==='BUTTON'){copy.onclick=()=>original[i].click();}else if(original[i].classList.contains('paper')){copy.classList.add('paper');}});overlay.hidden=false;dialogOpen=true;$('gameFrame').classList.add('in-dialog');$('sceneArt').src='assets/'+(['council-room.svg','music-room.svg','history-room.svg','science-room.svg','equipment-room.svg'][state.room]||'council-room.svg');}function closeDialog(){if(overlay)overlay.hidden=true;if($('gameFrame'))$('gameFrame').classList.remove('in-dialog');dialogOpen=false;}$('closeDialog').onclick=closeDialog;
const rooms=[
{name:'自治會辦公室',pos:[0,0],floor:'#a38b6d',wall:'#54768a',objects:[{id:'notice',x:4,y:2,label:'校長通知'},{id:'budget',x:11,y:2,label:'活動經費表'},{id:'xiaoqing',x:4,y:6,label:'小晴'},{id:'zihao',x:11,y:6,label:'子豪'}]},
{name:'音樂教室',pos:[-1,0],floor:'#a47964',wall:'#77566d',objects:[{id:'azhe',x:5,y:4,label:'阿哲'},{id:'music',x:11,y:3,label:'演出時間表'}]},
{name:'校史展覽室',pos:[1,0],floor:'#948978',wall:'#55776c',objects:[{id:'yian',x:5,y:4,label:'以安'},{id:'history',x:11,y:3,label:'展覽清單'}]},
{name:'科學教室',pos:[0,-1],floor:'#8e9a9c',wall:'#4b7880',objects:[{id:'science',x:5,y:4,label:'科學組長'},{id:'equipment',x:11,y:3,label:'器材表'}]},
{name:'器材室',pos:[0,1],floor:'#777e83',wall:'#69677e',objects:[{id:'acheng',x:5,y:4,label:'阿澄'},{id:'circuit',x:11,y:3,label:'配電圖'}]}
];
const dirs={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};
const exits=rooms.map(r=>Object.fromEntries(Object.entries(dirs).flatMap(([d,[dx,dy]])=>{let i=rooms.findIndex(q=>q.pos[0]===r.pos[0]+dx&&q.pos[1]===r.pos[1]+dy);return i<0?[]:[[d,i]];})));
const defaultState=()=>({version:1,room:0,x:8,y:5,seen:[],choices:{},phase:0,ending:null,selection:['science','history','music'],intro:false});
let state;
try{state=JSON.parse(localStorage.getItem('last-festival-v1'))||defaultState();if(!Number.isInteger(state.room)||!rooms[state.room]||!Array.isArray(state.seen)||!state.choices)state=defaultState();}catch(e){state=defaultState();}
const save=()=>{try{localStorage.setItem('last-festival-v1',JSON.stringify(state));}catch(e){}};
const docs={
notice:['校長室通知｜10月5日','舊校舍整修前最後一屆校園祭，原有六項提案，受場地與預算限制，只能保留三項。自治會須於10月8日中午前提交活動表。','校長室｜事務組'],
budget:['學生自治會經費試算','可用預算：8點；可調度工作人力：6人；活動名額：3。\n科學體驗：預算3、人力2。\n校史展覽：預算2、人力2。\n音樂演出：預算3、人力2。\n合計：預算8、人力6、名額3。\n備註：尚未計入設備故障或天候變動。','自治會財務紀錄｜10月5日'],
music:['音樂組演出時間表','14:00–14:10 開場\n14:10–14:35 合唱\n14:35–15:00 樂團\n15:00–15:15 收場\n舞台劇組申請使用14:35–14:50，與樂團時段重疊。','音樂組｜10月6日'],
history:['校史展覽清單','借用舊照片28張，其中12張未數位化。\n需要：乾燥室內空間、6張展示桌、避免飲水與實驗液體接近展品。\n目前展覽室可提供4張桌。','校史展覽組｜10月6日'],
equipment:['科學體驗器材清單','磁力小車：無須插電。\n光影實驗：投影機1台。\n電路體驗：低壓電源組2套。\n水流模型：需要水槽與防水桌墊。\n科學組願意調整展示項目，但須保留至少兩個可操作體驗。','科學組｜10月6日'],
circuit:['器材室配電檢查表','體育館東側插座群與展覽室投影設備共用同一迴路。\n目前音響與投影機同時啟動時，負載接近使用上限。\n建議：改用無電展示、分時段使用，並由老師確認設備配置。','後勤組 阿澄｜10月6日']
};
const mark=id=>{if(!state.seen.includes(id))state.seen.push(id);save();draw();};
function say(t){msg.textContent=t;choices.replaceChildren();syncDialog();}
function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;choices.appendChild(b);syncDialog();}
function documentView(id){mark(id);const [title,body,by]=docs[id];say('你拿起桌上的資料。');const d=document.createElement('div');d.className='paper';d.textContent=title+'\n\n'+body+'\n\n'+by;choices.appendChild(d);syncDialog();btn('收起文件',()=>say('文件已放入自治會工作桌。'));}
function talk(id){
mark(id);
if(id==='xiaoqing'){say('小晴把三份活動提案放在桌上。\n「目前名額已滿。阿哲剛才來問舞台劇的事。明天中午前一定要交出安排表。」');btn('問她有沒有其他限制',()=>say('小晴：「經費表在辦公室右側。場地能不能共用，我還沒拿到各組的器材清單。」'));}
if(id==='zihao'){say('子豪：「三個活動已經選好了。要不要直接公布？這樣大家才有時間準備。」');btn('詢問他是否看過各組清單',()=>say('子豪：「還沒。我只看了提案需要的人力和預算。你可以去找各組長。」'));}
if(id==='azhe'){say('阿哲拿出一本寫滿筆記的劇本。\n「我們排練了三個月。音樂組有舞台，我們卻沒有。你們能不能留十五分鐘？」');btn('詢問能否改成短篇演出',()=>{state.choices.azhe='short';save();say('阿哲翻了幾頁：「可以縮成十分鐘，但需要音樂組同意讓出時段。我去問他們。」');draw();});btn('告訴他目前沒有空檔',()=>{state.choices.azhe='declined';save();say('阿哲合上劇本：「好，我會告訴組員。」他把劇本收進書包。');draw();});btn('承諾一定安排演出',()=>{state.choices.azhe='promise';save();say('阿哲：「真的？那我們今晚繼續排練。」你還沒有取得音樂組同意。');draw();});}
if(id==='yian'){say('以安正在把老照片放進保護套。\n「這十二張沒有電子檔，借來時老師說不能碰水。展覽室只有四張桌子，我們還缺兩張。」');btn('提議先把照片掃描備份',()=>{state.choices.history='scan';save();say('以安：「我可以先請老師協助掃描。不過今天要先把原件搬進乾燥的地方。」');draw();});btn('建議和科學組共用場地',()=>{state.choices.history='share';save();say('以安：「如果他們不使用水流模型，也許可以。但請先看看器材表。」');draw();});}
if(id==='science'){say('科學組長指著桌上的磁力小車。\n「我們最想讓大家親手試。水流模型和投影機只是其中兩項，可以討論。」');btn('詢問能否改成無水、低耗電展示',()=>{state.choices.science='low';save();say('科學組長：「磁力小車和手動光影盒可以留下。我們要花一個下午重新做材料。」');draw();});btn('維持原有展示項目',()=>{state.choices.science='full';save();say('科學組長：「那我們需要原本的水槽、投影機和插座。」');draw();});}
if(id==='acheng'){say('阿澄把一張配電圖推到你面前。\n「音響和投影機會用到同一組電路。我還沒把這件事告訴各組。」');btn('請他參加下一次場地協調',()=>{state.choices.acheng='included';save();say('阿澄：「好，我把每個時段的設備使用情況整理出來。」');draw();});btn('請他先整理器材即可',()=>{state.choices.acheng='ignored';save();say('阿澄：「好。但用電的事情還是得有人確認。」');draw();});}
}
function interact(){const obj=rooms[state.room].objects.find(o=>Math.abs(o.x-state.x)<=1&&Math.abs(o.y-state.y)<=1);if(!obj){say('附近沒有可互動的人物或物件。');return;}if(docs[obj.id])documentView(obj.id);else talk(obj.id);}
function readiness(){return ['notice','budget','music','history','equipment','circuit'].filter(id=>state.seen.includes(id)).length;}
function meeting(){
if(readiness()<4){say('小晴：「我們還沒拿到足夠的場地與器材資料。先把各組的文件找齊幾份，再討論安排吧。」');return;}
say('【10月7日｜自治會協調會】\n桌上放著三份活動表。音樂組希望保留完整演出，展覽組需要乾燥空間，科學組希望保留動手操作。\n小晴：「明天中午就要交了。這次怎麼安排？」');
btn('三組依原計畫分開準備',()=>resolve('separate'));
btn('安排共用場地，先確認設備與動線',()=>resolve('coordinate'));
btn('邀請舞台劇組參與音樂演出協商',()=>negotiateStage());
}
function negotiateStage(){
if(!state.seen.includes('music')){say('小晴：「音樂組的時間表還沒拿到。先確認他們原本的安排吧。」');return;}
if(state.choices.azhe!=='short'){say('小晴：「阿哲提出的是十五分鐘舞台時段，音樂組現在沒有空檔。你先去問他能不能調整演出內容。」');return;}
say('【音樂組協商｜10月7日】\n音樂組代表：「樂團原訂14:35到15:00，排練三週了。如果要插入短劇，必須取消兩首歌。我不能自己替全組決定。」\n\n阿哲：「我們可以縮成十分鐘，還需要你們同意。」');
btn('請音樂組先詢問組員，維持原時間表直到表決',()=>{state.choices.musicConsent='pending';save();say('音樂組代表帶走了修訂時間表。今天還不能確認舞台劇是否加入。');btn('改採原定三組方案',()=>resolve('separate'));});
btn('提出音樂與短劇共用十五分鐘，並請音樂組表決',()=>{state.choices.musicConsent='yes';save();say('音樂組代表回來了：「我們六個人投票，四個同意改成短劇配樂，兩個希望保留原曲。已經確認新的15分鐘節目單。」');btn('提交共同演出方案',()=>resolve('stage'));});
btn('暫不變動音樂組時段',()=>resolve('separate'));
}
function resolve(plan){
if(plan==='stage'&&!(state.choices.azhe==='short'&&state.choices.musicConsent==='yes')){say('音樂組尚未確認新的節目單，無法提交共同演出方案。');return;}state.choices.plan=plan;state.phase=1;save();draw();
const text={separate:'各組收到原定時段。音樂組照表排練，校史組繼續找展示桌。阿哲把舞台劇劇本帶回教室。',coordinate:'你把各組清單攤在桌上。科學組提出改用磁力小車，以安同意討論展區共用，但展品仍須隔離水源。',stage:'阿哲帶著十分鐘的短篇劇本來到會議。音樂組同意討論，但提出必須保留合唱與收場時間。'}[plan];
say('【協調結果】\n'+text+'\n\n傍晚，總務處送來最新氣象通知：活動日可能降下大雨，戶外備用空間不能保證使用。');btn('查看雨天應變安排',storm);}
function storm(){say('【10月8日｜雨天備案】\n總務處公告：戶外場地暫停列入正式活動空間。體育館與兩間教室可供使用。\n阿澄的配電圖仍在桌上。音樂組需要音響，科學組原提案需要投影機。');btn('將高耗電項目錯開時段，保留安全動線',()=>ending('schedule'));btn('科學組改用無水、低耗電體驗，與校史展覽分區',()=>{if(state.choices.science!=='low'){say('科學組還沒答應調整展示內容。先到科學教室確認他們能否改做磁力小車與手動光影盒。');btn('返回雨天應變',storm);return;}if(state.choices.history!=='share'&&state.choices.history!=='scan'){say('校史展覽組還不知道要改動場地。先找以安確認展品的保護方式。');btn('返回雨天應變',storm);return;}ending('adapt');});btn('照原時間表進行，開幕當天再視情況調整',()=>ending('unchanged'));}
function ending(action){state.phase=2;state.choices.storm=action;let safe=action!=='unchanged';let joined=state.choices.plan==='stage'&&state.choices.azhe==='short'&&state.choices.musicConsent==='yes';let flexible=action==='adapt'||(state.choices.science==='low'&&action!=='unchanged');let trust=state.choices.azhe==='promise'&&!joined;let parts=[];
parts.push('【10月9日｜校園祭當天】');
parts.push(safe?'雨停了一陣，學生依照重新張貼的動線圖進入各活動室。':'活動開始前，老師檢查配電配置，要求音響與投影機不得同時啟動。科學組臨時撤下光影實驗。');
parts.push(flexible?'科學組的磁力小車和手動光影盒吸引了不少人排隊。':'科學組依照核准的時段輪流開放體驗。');
parts.push(state.choices.history==='scan'?'校史組展出掃描複本，原件由老師收存。':'校史組將原件移入乾燥展櫃，因桌數不足只展出部分照片。');
parts.push(joined?'音樂組刪去兩首曲目，與阿哲的短劇合作完成十五分鐘節目。':'音樂組依核准時段完成演出。阿哲的劇本沒有列入節目表。');
if(state.choices.plan==='coordinate'&&state.choices.history==='share'&&state.choices.science!=='low')parts.push('展覽組看過科學組的水流模型後，拒絕共用展區。兩組最後分開布置，少了兩張展示桌。');
