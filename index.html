const scenes=[
{name:'圖書館',floor:'#c6a87c',objects:[{x:3,y:2,label:'借閱統計表',id:'stats',text:'四年級借閱統計：活動前一週 80 冊，閱讀週 164 冊。資料由圖書館借閱系統匯出。'},{x:8,y:2,label:'閱讀週公告',id:'notice',text:'閱讀週活動：每借閱一本書可獲得一點，集滿五點可兌換書籤。活動期間為星期一至星期五。'},{x:5,y:6,label:'黃小米老師',id:'teacher',text:'黃小米老師：我們整理的是借出冊數，活動週從星期一到星期五。'}]},
{name:'四年級教室',floor:'#a8c5b4',objects:[{x:3,y:2,label:'小華',id:'hua',text:'小華：我借了六本，有兩本已經讀完，其他還放在書包裡。'},{x:8,y:3,label:'明明',id:'ming',text:'明明：我和同學一起參加集點，還交換推薦的書單。'},{x:5,y:6,label:'班級閱讀紀錄',id:'class',text:'四年級閱讀紀錄：本週完成心得分享的學生共 12 人；上週共 9 人。'}]},

function compareReports(){
if(state.publications.length<2){say('需要至少兩版報導才能比較。');return;}
const a=state.publications[state.publications.length-2],b=state.publications[state.publications.length-1];
const changes=[];
if(a.headline!==b.headline)changes.push('標題：'+headlines[a.headline]+' → '+headlines[b.headline]);
if(a.bodyChoice!==b.bodyChoice)changes.push('主段落：'+(bodyOptions[a.bodyChoice]||bodyOptions[0])+' → '+(bodyOptions[b.bodyChoice]||bodyOptions[0]));
const added=b.citations.filter(id=>!a.citations.includes(id)),removed=a.citations.filter(id=>!b.citations.includes(id));
if(added.length)changes.push('新增引用：'+added.map(id=>names[id]||id).join('、'));
if(removed.length)changes.push('移除引用：'+removed.map(id=>names[id]||id).join('、'));
if(!changes.length)changes.push('這兩版的標題、主段落與引用資料相同。');
say('【校刊修訂比較｜第 '+(state.publications.length-1)+' 版 → 第 '+state.publications.length+' 版】\n'+changes.join('\n'));
}
function narrative(){
if(!state.introSeen){
state.introSeen=true;save();
say('【校刊社｜截稿前三天】\n校園群組正在轉傳：「閱讀週讓四年級借閱量翻倍，閱讀能力全面提升！」\n你收到一則匿名訊息：「如果你真的想寫這件事，就去看看那些數字是怎麼來的。」\n你決定從圖書館開始調查。');
return;
}
if(state.publications.length>=2&&!state.chapterDone){
state.chapterDone=true;save();
say('【第一章・尾聲】\n第二版校刊發行了。有人保留第一版的截圖，也有人轉傳你的新版本。\n放學前，校刊社收到另一張紙條：「你們想知道誰最先寫下那句話嗎？」\n紙條背面只有一個日期。故事還沒結束。');
return;
}
}
function draw(){
ctx.clearRect(0,0,640,384);roomArt();
ctx.fillStyle='#fff0c6';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
const links=routes[state.scene];
for(const [dir,target] of Object.entries(links)){
let x=320,y=180;
if(dir==='left'){x=67;y=132;}if(dir==='right'){x=573;y=132;}if(dir==='up'){x=320;y=31;}if(dir==='down'){x=320;y=320;}
ctx.fillStyle='#293a46';ctx.fillRect(x-62,y-13,124,24);ctx.fillStyle='#ffe3a4';
ctx.fillText(({left:'← ',right:'→ ',up:'↑ ',down:'↓ '})[dir]+scenes[target].name,x,y+4);
}
if(links.up){rect(280,4,80,26,'#d5a765');rect(289,7,62,18,'#ffe3a4');}
if(links.down){rect(280,332,80,24,'#d5a765');rect(289,336,62,14,'#ffe3a4');}
for(const o of scenes[state.scene].objects){const px=o.x*T,py=o.y*T;prop(o);ctx.fillStyle='#26303a';ctx.fillRect(px-26,py-21,92,18);ctx.fillStyle='#fff2d2';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(o.label,px+20,py-8);}
// Pixel-art investigator with direction indicator, bag and face
const px=state.x*T,py=state.y*T;
ctx.fillStyle='#263e73';ctx.fillRect(px+9,py+18,22,17);
ctx.fillStyle='#394e71';ctx.fillRect(px+5,py+21,5,13);ctx.fillRect(px+30,py+21,5,13);
ctx.fillStyle='#253046';ctx.fillRect(px+10,py+33,8,5);ctx.fillRect(px+22,py+33,8,5);
ctx.fillStyle='#d8a86e';ctx.fillRect(px+29,py+20,7,11);
ctx.fillStyle='#ffcf99';ctx.fillRect(px+11,py+6,18,16);
ctx.fillStyle='#273043';ctx.fillRect(px+10,py+4,20,6);
ctx.fillStyle='#1a2935';
if(state.direction==='left'){ctx.fillRect(px+12,py+13,3,3);}
else if(state.direction==='right'){ctx.fillRect(px+25,py+13,3,3);}
else if(state.direction==='down'){ctx.fillRect(px+15,py+13,3,3);ctx.fillRect(px+23,py+13,3,3);}
else{ctx.fillStyle='#394d63';ctx.fillRect(px+12,py+11,16,8);}
const near=scenes[state.scene].objects.find(o=>Math.abs(o.x-state.x)<=1&&Math.abs(o.y-state.y)<=1);
if(near){const px=near.x*T+20,py=near.y*T-24;ctx.fillStyle='#fff1b6';ctx.fillRect(px-16,py-16,32,23);ctx.fillStyle='#202b39';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('!',px,py);ctx.strokeStyle='#ffeb88';ctx.lineWidth=3;ctx.strokeRect(near.x*T+2,near.y*T+2,36,36);ctx.lineWidth=1;}
ctx.fillStyle='#172633';ctx.fillRect(0,360,640,24);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='14px sans-serif';ctx.fillText(near?'可調查：'+near.label+'｜按調查／對話':'場景：'+scenes[state.scene].name+'｜黃色門口切換場景',12,377);
sceneTitle.textContent=scenes[state.scene].name;inv.replaceChildren();if(!state.found.length){inv.textContent='尚未蒐集資料';}else{state.found.forEach(id=>{const b=document.createElement('button');b.textContent='📄 '+(names[id]||id);b.style.margin='4px';b.style.fontSize='13px';b.onclick=()=>review(id);inv.appendChild(b);});}status.textContent='已蒐集 '+state.found.length+' 項資料｜已發表 '+state.publications.length+' 篇版本';
const tasks=[['走訪圖書館',state.found.some(x=>['stats','notice','teacher'].includes(x))],['走訪四年級教室',state.found.some(x=>['hua','ming','class'].includes(x))],['前往校刊社發表',state.publications.length>0],['發表後回訪一位受訪者',state.followups.length>0],['重新編輯並發表第二版',state.publications.length>1]];
quest.textContent=tasks.map(([t,done])=>(done?'☑ ':'☐ ')+t).join('　｜　');
board.replaceChildren();
const boardIntro=document.createElement('div');boardIntro.className='hint';boardIntro.textContent='把已發現的資料貼到紀錄板。這裡只整理線索，不替你下結論。';board.appendChild(boardIntro);
if(!state.boardNotes.length){const empty=document.createElement('div');empty.textContent='目前沒有釘選的資料。';board.appendChild(empty);}
else state.boardNotes.forEach(id=>{const card=document.createElement('div');card.className='record';const b=document.createElement('button');b.textContent='查看 '+(names[id]||id);b.onclick=()=>review(id);card.appendChild(b);board.appendChild(card);});
const addable=state.found.filter(id=>!state.boardNotes.includes(id));if(addable.length){const tools=document.createElement('div');tools.className='tabs';addable.forEach(id=>{const b=document.createElement('button');b.textContent='＋'+(names[id]||id);b.onclick=()=>noteBoard(id);tools.appendChild(b);});board.appendChild(tools);}

letters.replaceChildren();
if(!state.publications.length){letters.textContent='校刊發行後，讀者來信會出現在這裡。';}
else {
const latest=state.publications[state.publications.length-1];
const lettersData=[
{from:'五年級讀者 阿甘',text:'我在群組看到「閱讀能力全面提升」。你們有做閱讀能力測驗嗎？'},
{from:'四年級閱讀小隊 小華',text:'我這週借了六本書，現在讀完兩本。我的心得還沒寫好。'},
{from:'圖書館老師 黃小米',text:'附件是借閱系統匯出的統計表。下週的數字要等星期五才能整理。'},
{from:'校刊社讀者 明明',text:'你們提到我和同學交換書單，我可以提供我們寫的推薦卡。'}
];
const selected=latest.headline===0?[0,2]:latest.headline===1?[2,1]:[1,3];
if(state.publications.length>1&&!selected.includes(3))selected.push(3);
selected.forEach(i=>{const note=document.createElement('div');note.className='record';const title=document.createElement('strong');title.textContent=lettersData[i].from;const body=document.createElement('div');body.textContent=lettersData[i].text;note.append(title,body);letters.appendChild(note);});
}
history.replaceChildren();
if(!state.publications.length){history.textContent='尚未發表報導。';}else {if(state.publications.length>=2){const compare=document.createElement('button');compare.textContent='比較最近兩版的修改';compare.onclick=compareReports;history.appendChild(compare);}state.publications.forEach((pub,i)=>{
const wrap=document.createElement('div');wrap.className='record';
const heading=document.createElement('strong');heading.textContent='第 '+(i+1)+' 版｜'+(headlines[pub.headline]||'未命名標題');wrap.appendChild(heading);
const paragraph=document.createElement('div');paragraph.textContent=bodyOptions[pub.bodyChoice]||bodyOptions[0];wrap.appendChild(paragraph);
const detail=document.createElement('div');detail.textContent='引用：'+((pub.citations||[]).map(id=>names[id]||id).join('、')||'未列出');wrap.appendChild(detail);
const b=document.createElement('button');b.textContent='閱讀這一版';b.style.fontSize='13px';b.style.padding='6px 10px';b.onclick=()=>{say('【第 '+(i+1)+' 版】\n'+(headlines[pub.headline]||'')+'\n引用資料：'+detail.textContent.slice(3));window.scrollTo({top:document.getElementById('message').getBoundingClientRect().top+window.scrollY-70,behavior:'smooth'});};wrap.appendChild(b);history.appendChild(wrap);
});}
}
function move(dx,dy){
if(dx<0)state.direction='left';else if(dx>0)state.direction='right';else if(dy<0)state.direction='up';else if(dy>0)state.direction='down';
let x=Math.max(1,Math.min(14,state.x+dx)),y=Math.max(1,Math.min(7,state.y+dy));
if(blocked(state.scene,x,y)){draw();return;}
state.x=x;state.y=y;animationFrame++;
let exit=null;
if(x===14&&y>=3&&y<=5)exit='right';
else if(x===1&&y>=3&&y<=5)exit='left';
else if(y===1&&x>=7&&x<=8)exit='up';
else if(y===7&&x>=7&&x<=8)exit='down';
const destination=exit&&routes[state.scene][exit];
if(destination!==undefined){
state.scene=destination;
const entry={right:[2,4],left:[13,4],up:[7,6],down:[7,2]}[exit];
state.x=entry[0];state.y=entry[1];
say('你從'+routeNames[exit]+'通道來到「'+scenes[state.scene].name+'」。仔細看看這裡有什麼新線索。');
}
save();draw();
}
function review(id){const o=scenes.flatMap(scene=>scene.objects).find(item=>item.id===id);if(o){if(documentIds.has(id))documentView(o);else say('【'+(names[id]||o.label)+'】'+o.text);}}
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;choices.appendChild(b);}
function interact(targetId){const o=scenes[state.scene].objects.find(o=>(!targetId||o.id===targetId)&&Math.abs(o.x-state.x)<=1&&Math.abs(o.y-state.y)<=1);if(!o){say('附近沒有可調查的物件。請靠近人物或文件。');return;}let detail=o.text;
if(state.publications.length&&['teacher','hua','ming'].includes(o.id)){
const extra={teacher:'黃小米老師：校刊出來了啊！下週我還會匯出一份借閱紀錄。',hua:'小華：我看到校刊了。我昨天又讀完一本借來的書。',ming:'明明：我們班有人把報導貼在群組，大家都在討論。'};
detail+='\n【發表後回訪】'+extra[o.id];if(!state.followups.includes(o.id))state.followups.push(o.id);
}
say(detail);if(o.id==='editor'){openEditor();}else{if(!state.found.includes(o.id))state.found.push(o.id);save();draw();if(documentIds.has(o.id))documentView(o);}}
const bodyOptions=['活動成果：四年級閱讀週借閱紀錄為164冊，活動前一週為80冊。','學生經驗：小華借了六本書，其中兩本已讀完；明明和同學交換推薦書單。','活動安排：閱讀週每借一本書可獲得一點，集滿五點可兌換書籤。'];
const headlines=['閱讀週讓四年級閱讀能力全面提升！','四年級閱讀週借閱冊數從80冊增至164冊','閱讀週的借閱數字與學生故事'];
function openEditor(){
say('校刊編輯桌：請選擇標題與引用資料。你可以在資料尚未蒐集齊全時發稿。');
const h=document.createElement('div');h.textContent='第一步：選擇標題';choices.appendChild(h);
headlines.forEach((name,i)=>button((state.headline===i?'✓ ':'')+name,()=>{state.headline=i;save();openEditor();}));
if(state.headline===null)return;
const bodyHeading=document.createElement('div');bodyHeading.textContent='第二步：選擇報導主段落';bodyHeading.style.width='100%';choices.appendChild(bodyHeading);
bodyOptions.forEach((body,i)=>button((state.bodyChoice===i?'◉ ':'○ ')+body,()=>{state.bodyChoice=i;save();openEditor();}));
const t=document.createElement('div');t.textContent='第三步：勾選要引用的資料（可多選）';t.style.width='100%';choices.appendChild(t);
state.found.forEach(id=>{const b=document.createElement('button');b.textContent=(state.citations.includes(id)?'☑ ':'☐ ')+(names[id]||id);b.onclick=()=>{if(state.citations.includes(id))state.citations=state.citations.filter(x=>x!==id);else state.citations.push(id);save();openEditor();};choices.appendChild(b);});
const preview=document.createElement('div');preview.className='record';preview.style.width='100%';preview.textContent='報導預覽｜'+headlines[state.headline]+'\n'+bodyOptions[state.bodyChoice]+'\n引用：'+(state.citations.map(id=>names[id]||id).join('、')||'未列出');preview.style.whiteSpace='pre-line';choices.appendChild(preview);
button('確認發表報導',()=>finish(state.headline));
}
function finish(n){
const citations=state.citations.map(id=>names[id]||id);
const reactions=[
'讀者留言：「你們是怎麼測量閱讀能力的？我想看調查方式。」',
'黃小米老師轉貼報導，並補充下一週的借閱紀錄仍在整理中。',
'小華把報導分享給同學，明明留言說也想分享自己借書的經驗。'
];
state.ending=n+1;state.publications.push({headline:n,bodyChoice:state.bodyChoice,citations:[...state.citations],timestamp:Date.now()});save();draw();
say('【校刊已發表】\\n標題：'+headlines[n]+'\\n引用資料：'+(citations.join('、')||'未列出')+'\\n讀者回應：'+reactions[n]+'\\n你可以繼續探索、回訪人物，或回到編輯桌發表修訂版。');
if(state.publications.length>=2){button('比較兩版報導',compareReports);button('閱讀第一章尾聲',()=>{state.chapterDone=false;narrative();});}else{button('閱讀讀者來信',()=>{say('新一期校刊已送出。你可以在下方「讀者來信」查看不同讀者的留言。');});}
}
const keymap={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
document.addEventListener('keydown',e=>{if(keymap[e.key]){e.preventDefault();move(...keymap[e.key]);}else if(e.key===' '||e.key==='Enter'){e.preventDefault();interact();}});
// Long-press to walk, while preserving one-tap movement
let walkTimer=null,walkDelay=null;
function stopWalk(){clearInterval(walkTimer);clearTimeout(walkDelay);walkTimer=null;walkDelay=null;}
document.querySelectorAll('[data-dir]').forEach(b=>{
const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];
b.addEventListener('pointerdown',e=>{e.preventDefault();stopWalk();try{b.setPointerCapture(e.pointerId);}catch(err){}move(...d);walkDelay=setTimeout(()=>{walkTimer=setInterval(()=>move(...d),135);},260);});
['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(name=>b.addEventListener(name,stopWalk));
});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopWalk();});
document.getElementById('interact').onclick=()=>interact();
cv.addEventListener('pointerdown',e=>{
const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*640/T),y=Math.floor((e.clientY-r.top)/r.height*384/T);
const o=scenes[state.scene].objects.find(o=>o.x===x&&o.y===y);
if(o&&Math.abs(o.x-state.x)<=1&&Math.abs(o.y-state.y)<=1){interact(o.id);}
});

document.getElementById('reset').onclick=()=>{if(confirm('確定清除目前進度？')){state={scene:0,x:2,y:4,found:[],ending:null,citations:[],headline:null,publications:[],followups:[],readerLetters:[],direction:'down',introSeen:false,chapterDone:false};save();draw();narrative();}};
draw();narrative();
window.addEventListener('error',e=>{document.getElementById('error').textContent='執行錯誤：'+e.message;});
})();
</script></body></html>
